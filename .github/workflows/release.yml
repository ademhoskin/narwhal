name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: narwhal-linux-x64
            runner: ubuntu-latest
          # Native arm64 hosted runner. Free for public repositories and needs
          # no binfmt emulation; nix/package.nix already selects linux-arm64.
          - artifact: narwhal-linux-arm64
            runner: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
      - name: extract version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(nix eval --raw .#default.version)"
          fi
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: build
        run: nix build .#default
      - name: smoke test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$(result/bin/narwhal version)" = "$VERSION"
          result/bin/narwhal --help > /dev/null
          cp -L result/bin/narwhal "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: narwhal-linux-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          files: |
            narwhal-linux-x64
            narwhal-linux-arm64
