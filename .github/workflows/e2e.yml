name: e2e

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e registry and concurrent push
    runs-on: ubuntu-latest
    env:
      NARWHAL_BIN: ${{ github.workspace }}/result/bin/narwhal
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
      - name: build the package
        run: nix build .#default
      - name: smoke test
        run: |
          test "$(result/bin/narwhal version)" = "0.1.0"
          result/bin/narwhal --help > /dev/null
      - name: pre-pull the registry image
        run: |
          podman info > /dev/null
          podman pull docker.io/library/registry:2
          podman image exists docker.io/library/registry:2
      # The scripts prefer NARWHAL_BIN, then NARWHAL_DLL (dotnet <dll>), then
      # `dotnet run --project src/Narwhal`; CI sets NARWHAL_BIN.
      - name: local registry push
        run: |
          set +e
          nix develop --command bash tests/e2e/local-registry-push.sh
          status=$?
          set -e
          if [ "$status" -eq 77 ]; then
            echo "::error::local-registry-push.sh exited 77 (skip): podman, curl, jq, bash >= 4.4, or registry:2 is unavailable"
            exit 1
          fi
          exit "$status"
      - name: local registry concurrent push
        run: |
          set +e
          nix develop --command bash tests/e2e/local-registry-concurrent-push.sh
          status=$?
          set -e
          if [ "$status" -eq 77 ]; then
            echo "::error::local-registry-concurrent-push.sh exited 77 (skip): podman, curl, jq, bash >= 4.4, or registry:2 is unavailable"
            exit 1
          fi
          exit "$status"
