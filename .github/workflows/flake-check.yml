name: flake drift

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  group: flake-drift
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: nixpkgs drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
      - name: update flake inputs
        run: nix flake update
      - name: build
        run: nix build .#default
      - name: unit tests
        run: nix develop --command dotnet test tests/Narwhal.Tests --nologo
      - name: open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Flake drift check failed"
          if gh issue list --state open --search "$title in:title" --json title --jq '.[].title' | grep -Fxq "$title"; then
            echo "an open issue already tracks this"
            exit 0
          fi
          gh issue create --title "$title" --body "$(cat <<EOF
          The scheduled flake drift check failed.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          \`nix flake update\` plus \`nix build .#default\` and the unit tests did not pass
          against the current nixpkgs-unstable inputs.
          EOF
          )"
