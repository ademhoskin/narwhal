name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: format and analyzers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
      - name: cache NuGet packages
        uses: actions/cache@v6
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj', 'Directory.Build.props', 'global.json', 'flake.lock') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: check analyzers
        run: |
          for project in $(git ls-files '*.csproj'); do
            nix develop --command dotnet build "$project" -t:Rebuild
          done
      - name: check formatting
        run: |
          for project in $(git ls-files '*.csproj'); do
            nix develop --command dotnet format "$project" --verify-no-changes
          done
          nix develop --command nix fmt -- --check $(git ls-files '*.nix')

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
      - name: cache NuGet packages
        uses: actions/cache@v6
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj', 'Directory.Build.props', 'global.json', 'flake.lock') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: test
        run: nix develop --command dotnet test tests/Narwhal.Tests --nologo

  aot:
    name: native aot binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
      - name: cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-aot-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: |
            nix-aot-${{ runner.os }}-
            nix-example-${{ runner.os }}-
          gc-max-store-size-linux: 4G
      - name: build the package
        run: nix build .#default
      - name: smoke test
        run: |
          test "$(result/bin/narwhal version)" = "0.1.0"
          result/bin/narwhal --help > /dev/null
          cp -L result/bin/narwhal narwhal-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: narwhal-linux-x64
          path: narwhal-linux-x64

  example:
    name: example builds, deploys and verifies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
      - name: cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-example-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: |
            nix-example-${{ runner.os }}-
            nix-aot-${{ runner.os }}-
          gc-max-store-size-linux: 4G
      - name: build narwhal
        run: nix build .#default
      - name: build images and write the lock
        working-directory: examples/hello
        run: ../../result/bin/narwhal build
      - name: verify reproducibility
        working-directory: examples/hello
        run: ../../result/bin/narwhal verify
      - name: deploy with podman
        working-directory: examples/hello
        run: |
          ../../result/bin/narwhal up
          curl -fsS --retry 5 --retry-connrefused http://127.0.0.1:18080/
          ../../result/bin/narwhal ps
      - name: tear down
        if: always()
        working-directory: examples/hello
        run: ../../result/bin/narwhal down --volumes || true
